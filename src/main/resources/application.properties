spring.config.import=optional:file:.env[.properties]
spring.application.name=tourism-backend
server.port=${PORT:8080}

# Database (Supabase PostgreSQL) - values come from environment variables, never hardcoded
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update is convenient for hackathon-speed iteration.
# Switch to 'validate' (with manual migrations) later if you want stricter schema control before the demo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Secret must be a long random string, at least 256 bits (32+ chars) for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
