spring.config.import=optional:file:.env[.properties]
spring.application.name=tourism-backend
server.port=${PORT:8080}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Database (Supabase PostgreSQL) - values come from environment variables, never hardcoded
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update is convenient for hackathon-speed iteration.
# Switch to 'validate' (with manual migrations) later if you want stricter schema control before the demo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Required when using Supabase's transaction pooler (port 6543) / PgBouncer.
# Without this, Hibernate's JDBC metadata probing at startup can misbehave
# against the pooler and cause intermittent request-time failures.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JWT
# Secret must be a long random string, at least 256 bits (32+ chars) for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000